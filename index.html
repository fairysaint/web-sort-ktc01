<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điều Hành Sort KTC 01</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <style>
        body, input, textarea, select, button, table {
            font-family: 'Times New Roman', Times, serif !important;
        }
        .excel-table th, .excel-table td { 
            border: 1px solid #000000 !important; 
            vertical-align: middle !important;
        }
        .excel-table {
            table-layout: fixed;
            width: 100% !important;
        }
        .note-textarea {
            resize: none;
            overflow: hidden;
            background: transparent;
            word-break: break-all;
            white-space: pre-wrap;
            text-align: center;
            font-size: 10px;
            line-height: 1.3;
            width: 100%;
            border: none;
            display: block;
            height: auto;
        }
        .note-textarea:focus { outline: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;

        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 text-[11px] antialiased">

    <div id="root"></div>

    <script>
        const SPREADSHEET_ID = "2PACX-1vR9Dr7VQeqSwvvbv0HCypWct2ygmiDh4wsWmBm-n7XZCeIMPuOAtePGf2w1KNPv_d7G3b6lQiCQnIMv";
        const URL_LICH_LAM_VIEC = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=594239313&output=csv`;
        const URL_VI_PHAM       = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=0&output=csv`;
        const URL_BIEN_BAN      = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=735999237&output=csv`;

        const e = React.createElement;

        function parseCSV(text) {
          if (!text) return [];
          const lines = text.split(/\r\n|\n/);
          const result = [];
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!line) continue;
            const row = [];
            let current = '';
            let inQuotes = false;
            for (let j = 0; j < line.length; j++) {
              const char = line[j];
              if (char === '"') { inQuotes = !inQuotes; }
              else if (char === ',' && !inQuotes) { row.push(current.trim()); current = ''; }
              else { current += char; }
            }
            row.push(current.trim());
            result.push(row);
          }
          return result;
        }

        function timeToHours(tStr) {
          if (!tStr || !tStr.includes(':')) return 0;
          const [h, m] = tStr.split(':').map(Number);
          return h + (m / 60);
        }

        function getTodayString() {
          const today = new Date();
          const dd = String(today.getDate()).padStart(2, '0');
          const mm = String(today.getMonth() + 1).padStart(2, '0');
          return `${dd}/${mm}/${today.getFullYear()}`;
        }

        function parseDateDetails(dateStr) {
          if (!dateStr) return { day: null, month: null, rawDate: "" };
          const cleanStr = dateStr.split(' ')[0];
          let parts = [];
          if (cleanStr.includes('/')) parts = cleanStr.split('/');
          else if (cleanStr.includes('-')) parts = cleanStr.split('-');
          
          if (parts.length >= 2) {
            const d = parts[0].length <= 2 ? parseInt(parts[0], 10) : parseInt(parts[2], 10);
            const m = parseInt(parts[1], 10);
            return { day: d, month: m, rawDate: String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0') };
          }
          return { day: null, month: null, rawDate: dateStr };
        }

        function parseDDMMYYYY(dateStr) {
          if (!dateStr) return null;
          const parts = dateStr.split('/');
          if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
          return null;
        }

        function App() {
          const [userRole, setUserRole] = React.useState('none');
          const [usernameInput, setUsernameInput] = React.useState('');
          const [passwordInput, setPasswordInput] = React.useState('');

          const [activeTab, setActiveTab] = React.useState('vi-pham');
          const [isMenuOpen, setIsMenuOpen] = React.useState(false);
          const [filterName, setFilterName] = React.useState('');
          const [filterMonth, setFilterMonth] = React.useState('');

          const [allLichHeaders, setAllLichHeaders] = React.useState([]); 
          const [lichRows, setLichRows] = React.useState([]);       
          const [selectedLichDate, setSelectedLichDate] = React.useState(() => new Date().toISOString().split('T')[0]);

          const [violationData, setViolationData] = React.useState([]);
          const [bienbanData, setBienbanData] = React.useState([]);
          const [isLoading, setIsLoading] = React.useState(true);

          const todayStr = React.useMemo(() => getTodayString(), []);

          const [inputs, setInputs] = React.useState({
            ca_chung: '07:00-16:00',
            vt_leader: 'Leader', v_leader: '07:30', r_leader: '16:30', tns_leader: 3, skh_leader: 3, sdung_leader: 3, note_leader: '',
            vt_nsuat: 'NV Năng suất', v_nsuat: '07:00', r_nsuat: '16:30', tns_nsuat: 39, skh_nsuat: 32, sdung_nsuat: 31, note_nsuat: '1 nhân viên off bệnh',
            vt_gcong: 'NV Giờ công', v_gcong: '07:00', r_gcong: '17:30', tns_gcong: 2, skh_gcong: 2, sdung_gcong: 2, note_gcong: '',
            vt_thuviec: 'Nhân viên thử việc', v_thuviec: '07:30', r_thuviec: '16:30', tns_thuviec: 0, skh_thuviec: 0, sdung_thuviec: 0, note_thuviec: '',
            vt_fl_had: 'FL - Hoa Anh Đào', v_fl_had: '08:00', r_fl_had: '17:00', tns_fl_had: 0, skh_fl_had: 0, sdung_fl_had: 0, note_fl_had: '',
            vt_fl_viec: 'FL - Viecco', v_fl_viec: '08:00', r_fl_viec: '17:00', tns_fl_viec: 0, skh_fl_viec: 0, sdung_fl_viec: 0, note_fl_viec: '',
            feeder_cbs1: 19701, feeder_cbs2: 37422, tron_lan: 1000, forecast: 65000,
            phat_sinh: 'Không'
          });

          const loadAllData = React.useCallback(async (forceRefresh = false) => {
            try {
              setIsLoading(true);

              if (!forceRefresh) {
                const cachedLich = sessionStorage.getItem('cache_lich');
                const cachedVi = sessionStorage.getItem('cache_vi');
                const cachedBb = sessionStorage.getItem('cache_bb');

                if (cachedLich && cachedVi && cachedBb) {
                  processAllTexts(cachedLich, cachedVi, cachedBb);
                  setIsLoading(false);
                  return;
                }
              }

              const queryParam = forceRefresh ? `&t=${Date.now()}` : '';
              const [resLich, resVi, resBb] = await Promise.all([
                fetch(URL_LICH_LAM_VIEC + queryParam),
                fetch(URL_VI_PHAM + queryParam),
                fetch(URL_BIEN_BAN + queryParam)
              ]);

              const [textLich, textVi, textBb] = await Promise.all([
                resLich.text(),
                resVi.text(),
                resBb.text()
              ]);

              sessionStorage.setItem('cache_lich', textLich);
              sessionStorage.setItem('cache_vi', textVi);
              sessionStorage.setItem('cache_bb', textBb);

              processAllTexts(textLich, textVi, textBb);
              setIsLoading(false);
            } catch (err) {
              console.error("Lỗi tải dữ liệu:", err);
              setIsLoading(false);
            }
          }, []);

          const processAllTexts = (textLich, textVi, textBb) => {
            const rawLich = parseCSV(textLich);
            if (rawLich.length > 4) {
              const dates = rawLich[2] || [];
              const days = rawLich[3] || [];
              const headers = [];
              for(let colIdx = 4; colIdx < dates.length; colIdx++) {
                if (dates[colIdx]) headers.push({ index: colIdx, dateStr: dates[colIdx], dayStr: days[colIdx] || '' });
              }
              setAllLichHeaders(headers);

              const parsedStaff = [];
              for (let i = 4; i < rawLich.length; i++) {
                const row = rawLich[i];
                if (row[3] && (row[3].includes("Tổng") || row[3].includes("Nhóm"))) break;
                if (row[3]) parsedStaff.push({ gioitinh: row[0] || '', stt: row[1] || '', msnv: row[2] || '', name: row[3], rawRow: row });
              }
              setLichRows(parsedStaff);
            }

            const rowsVi = parseCSV(textVi);
            const parsedVi = [];
            for(let idx = 1; idx < rowsVi.length; idx++) {
              const row = rowsVi[idx];
              if (row[2]) {
                const dateInfo = parseDateDetails(row[0]);
                if (dateInfo.month) parsedVi.push({ id: idx, time: row[0], code: row[1], name: row[2], error: row[3], userId: row[4], reporter: row[5], dateInfo });
              }
            }
            setViolationData(parsedVi);

            const rowsBb = parseCSV(textBb);
            const parsedBb = [];
            for(let idx = 1; idx < rowsBb.length; idx++) {
              const row = rowsBb[idx];
              if (row[2]) {
                const dateInfo = parseDateDetails(row[0]);
                if (dateInfo.month) parsedBb.push({ id: idx, date: row[0], username: row[1], name: row[2], content: row[3], userId: row[4], creator: row[5], image: row[6], dateInfo });
              }
            }
            setBienbanData(parsedBb);
          };

          React.useEffect(() => { loadAllData(false); }, [loadAllData]);

          const handleLoginSubmit = (eEvt) => {
            eEvt.preventDefault();
            if (usernameInput.trim()) {
              setUserRole('user');
              setActiveTab('lich-lam-viec');
            } else {
              alert('Vui lòng nhập tên tài khoản');
            }
          };

          const handleGuestSelect = () => {
            setUserRole('guest');
            setActiveTab('vi-pham');
          };

          const handleInputChange = React.useCallback((key, value, isNum = false) => {
            setInputs(p => ({ ...p, [key]: isNum ? (parseFloat(value) || 0) : value }));
          }, []);

          const computed = React.useMemo(() => {
            const i = inputs;
            const calcGc = (v, r) => { const diff = timeToHours(r) - timeToHours(v); return diff > 1 ? diff - 1 : 0; };
            const gc_leader = calcGc(i.v_leader, i.r_leader);
            const gc_nsuat = calcGc(i.v_nsuat, i.r_nsuat);
            const gc_gcong = calcGc(i.v_gcong, i.r_gcong);
            const gc_thuviec = calcGc(i.v_thuviec, i.r_thuviec);
            const gc_fl_had = calcGc(i.v_fl_had, i.r_fl_had);
            const gc_fl_viec = calcGc(i.v_fl_viec, i.r_fl_viec);

            const gctt_leader = gc_leader * i.sdung_leader;
            const gctt_nsuat = gc_nsuat * i.sdung_nsuat;
            const gctt_gcong = gc_gcong * i.sdung_gcong;
            const gctt_thuviec = gc_thuviec * i.sdung_thuviec;
            const gctt_fl_had = gc_fl_had * i.sdung_fl_had;
            const gctt_fl_viec = gc_fl_viec * i.sdung_fl_viec;

            const total_tns = i.tns_leader + i.tns_nsuat + i.tns_gcong + i.tns_thuviec + i.tns_fl_had + i.tns_fl_viec;
            const total_skh = i.skh_leader + i.skh_nsuat + i.skh_gcong + i.skh_thuviec + i.skh_fl_had + i.skh_fl_viec;
            const total_sdung = i.sdung_leader + i.sdung_nsuat + i.sdung_gcong + i.sdung_thuviec + i.sdung_fl_had + i.sdung_fl_viec;
            const total_gctt = gctt_leader + gctt_nsuat + gctt_gcong + gctt_thuviec + gctt_fl_had + gctt_fl_viec;
            const act_don = i.feeder_cbs1 + i.feeder_cbs2 + i.tron_lan;

            const tile_tong = total_skh > 0 ? Math.round((total_sdung / total_skh) * 100) : 0;
            const nang_suat_bao_cao = total_gctt > 0 ? Math.round(act_don / total_gctt) : 0;

            const reportText = `${todayStr}\nBáo cáo cuối ca Sort KTC HCM 01\n\n1/ Lượng hàng.\na. Forecast: ${i.forecast.toLocaleString()}\nb. Act: ${act_don.toLocaleString()}\n\n2/ Nhân sự.\nĐáp ứng nhân sự: ${tile_tong}%\n\n3/ Năng suất: ${nang_suat_bao_cao} đơn/h`;

            return {
              gc_leader, gc_nsuat, gc_gcong, gc_thuviec, gc_fl_had, gc_fl_viec,
              gctt_leader, gctt_nsuat, gctt_gcong, gctt_thuviec, gctt_fl_had, gctt_fl_viec,
              tile_leader: i.skh_leader > 0 ? Math.round((i.sdung_leader / i.skh_leader) * 100) : 0,
              tile_nsuat: i.skh_nsuat > 0 ? Math.round((i.sdung_nsuat / i.skh_nsuat) * 100) : 0,
              tile_gcong: i.skh_gcong > 0 ? Math.round((i.sdung_gcong / i.skh_gcong) * 100) : 0,
              tile_thuviec: i.skh_thuviec > 0 ? Math.round((i.sdung_thuviec / i.skh_thuviec) * 100) : 0,
              tile_fl_had: i.skh_fl_had > 0 ? Math.round((i.sdung_fl_had / i.skh_fl_had) * 100) : 0,
              tile_fl_viec: i.skh_fl_viec > 0 ? Math.round((i.sdung_fl_viec / i.skh_fl_viec) * 100) : 0,
              total_tns, total_skh, total_sdung, total_gctt, act_don, tile_tong, 
              nang_suat_diem_danh: total_gctt > 0 ? Math.round(i.forecast / total_gctt) : 0, 
              nang_suat_bao_cao, reportText, formatGctt: (val) => val.toFixed(1).replace('.', ','), 
              dapt_dat: tile_tong, dapt_thieu: tile_tong >= 100 ? 0 : (100 - tile_tong)
            };
          }, [inputs, todayStr]);

          const currentWeekHeaders = React.useMemo(() => {
            if (allLichHeaders.length === 0) return [];
            const targetDate = new Date(selectedLichDate);
            let matchedIdx = -1;

            for(let idx = 0; idx < allLichHeaders.length; idx++) {
              const d = parseDDMMYYYY(allLichHeaders[idx].dateStr);
              if (d && d.getFullYear() === targetDate.getFullYear() &&
                       d.getMonth() === targetDate.getMonth() &&
                       d.getDate() === targetDate.getDate()) {
                matchedIdx = idx;
                break;
              }
            }

            if (matchedIdx !== -1) {
              const startIdx = Math.floor(matchedIdx / 7) * 7;
              return allLichHeaders.slice(startIdx, startIdx + 7);
            }
            return allLichHeaders.slice(0, 7);
          }, [allLichHeaders, selectedLichDate]);

          const monthlyStats = React.useMemo(() => {
            const src = activeTab === 'vi-pham' ? violationData : bienbanData;
            const stats = {};

            for(let i = 0; i < src.length; i++) {
              const item = src[i];
              const m = item.dateInfo.month;
              if (!m) continue;

              if (!stats[m]) stats[m] = { count: 0, dayCounts: {}, errorCounts: {} };
              stats[m].count += 1;

              const rawDate = item.dateInfo.rawDate;
              if (rawDate) stats[m].dayCounts[rawDate] = (stats[m].dayCounts[rawDate] || 0) + 1;

              const errText = activeTab === 'vi-pham' ? item.error : item.content;
              if (errText) stats[m].errorCounts[errText] = (stats[m].errorCounts[errText] || 0) + 1;
            }

            const sortedMonths = Object.keys(stats).map(Number).sort((a, b) => a - b);
            const result = {};

            sortedMonths.forEach((m, idx) => {
              const s = stats[m];
              let maxDayStr = 'N/A';
              let maxDayCount = 0;
              Object.entries(s.dayCounts).forEach(([day, count]) => {
                if (count > maxDayCount) { maxDayCount = count; maxDayStr = day; }
              });

              const sortedErrors = Object.entries(s.errorCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3)
                .map(([name, qty]) => ({ name, qty }));

              let trendText = "Mới";
              let trendClass = "text-slate-500 font-bold bg-slate-100 px-1.5 py-0.5 rounded";

              if (idx > 0) {
                const prevCount = stats[sortedMonths[idx - 1]].count;
                if (prevCount > 0) {
                  const percentChange = Math.round(((s.count - prevCount) / prevCount) * 100);
                  if (percentChange > 0) {
                    trendText = `▲ Tăng ${percentChange}%`;
                    trendClass = "text-red-600 font-bold bg-red-50 border border-red-100 px-1.5 py-0.5 rounded";
                  } else if (percentChange < 0) {
                    trendText = `▼ Giảm ${Math.abs(percentChange)}%`;
                    trendClass = "text-emerald-600 font-bold bg-emerald-50 border border-emerald-100 px-1.5 py-0.5 rounded";
                  } else {
                    trendText = "➖ Không đổi";
                    trendClass = "text-slate-600 font-bold bg-slate-100 px-1.5 py-0.5 rounded";
                  }
                }
              }

              result[m] = { count: s.count, trendText, trendClass, maxDayStr, maxDayCount, topErrors: sortedErrors };
            });

            return result;
          }, [activeTab, violationData, bienbanData]);

          const activeMonthsWithData = React.useMemo(() => {
            const src = activeTab === 'vi-pham' ? violationData : bienbanData;
            const months = new Set();
            for(let i = 0; i < src.length; i++) {
              if (src[i].dateInfo.month !== null) months.add(src[i].dateInfo.month);
            }
            return Array.from(months).sort((a, b) => a - b);
          }, [activeTab, violationData, bienbanData]);

          const filteredRawData = React.useMemo(() => {
            const src = activeTab === 'vi-pham' ? violationData : bienbanData;
            const nameSearch = filterName.toLowerCase();
            const monthVal = filterMonth !== '' ? parseInt(filterMonth, 10) : null;

            return src.filter(item => {
              const matchMonth = monthVal === null || (item.dateInfo.month !== null && item.dateInfo.month === monthVal);
              const matchName = !nameSearch || item.name.toLowerCase().includes(nameSearch);
              return matchMonth && matchName;
            });
          }, [activeTab, violationData, bienbanData, filterName, filterMonth]);

          const changeWeekByOffset = (offsetDays) => {
            const curr = new Date(selectedLichDate);
            curr.setDate(curr.getDate() + offsetDays);
            setSelectedLichDate(curr.toISOString().split('T')[0]);
          };

          const availableMenuItems = React.useMemo(() => {
            const fullList = [
              ['lich-lam-viec', 'Bảng Lịch Tuần 📅', false],
              ['report-daily', 'Report & Tự Tính 📊', false],
              ['vi-pham', 'Dữ Liệu Vi Phạm ⚠️', true],
              ['bien-ban', 'Biên Bản Quy Trình 📝', true]
            ];

            if (userRole === 'user') {
              return fullList;
            } else {
              return fullList.filter(item => item[2] === true);
            }
          }, [userRole]);

          if (userRole === 'none') {
            return e('div', { className: 'min-h-screen flex items-center justify-center bg-slate-100 p-4' },
              e('div', { className: 'max-w-md w-full bg-white rounded-xl shadow-lg border border-orange-100 p-6 space-y-6' },
                e('div', { className: 'text-center space-y-2' },
                  e('div', { className: 'w-12 h-12 bg-orange-500 rounded-full flex items-center justify-center mx-auto text-white font-bold text-xl shadow-md' }, 'S'),
                  e('h2', { className: 'text-lg font-bold text-slate-800 uppercase tracking-wide' }, 'Hệ Thống Điều Hành Sort KTC 01'),
                  e('p', { className: 'text-xs text-slate-500 font-bold' }, 'Vui lòng chọn chế độ truy cập hệ thống')
                ),

                e('form', { onSubmit: handleLoginSubmit, className: 'space-y-3 bg-orange-50/40 p-4 rounded-lg border border-orange-100' },
                  e('div', { className: 'font-bold text-xs text-orange-900 border-b border-orange-200 pb-1' }, '🔐 Đăng nhập tài khoản (Đầy đủ quyền)'),
                  e('div', null,
                    e('label', { className: 'block text-[10px] font-bold text-slate-600 mb-1' }, 'Tên tài khoản / Mã nhân viên:'),
                    e('input', {
                      type: 'text',
                      required: true,
                      placeholder: 'Nhập tên tài khoản...',
                      className: 'w-full p-2 border border-slate-300 rounded font-bold text-slate-700 text-xs focus:outline-none focus:border-orange-500 bg-white',
                      value: usernameInput,
                      onChange: ev => setUsernameInput(ev.target.value)
                    })
                  ),
                  e('div', null,
                    e('label', { className: 'block text-[10px] font-bold text-slate-600 mb-1' }, 'Mật khẩu:'),
                    e('input', {
                      type: 'password',
                      placeholder: '••••••••',
                      className: 'w-full p-2 border border-slate-300 rounded font-bold text-slate-700 text-xs focus:outline-none focus:border-orange-500 bg-white',
                      value: passwordInput,
                      onChange: ev => setPasswordInput(ev.target.value)
                    })
                  ),
                  e('button', {
                    type: 'submit',
                    className: 'w-full py-2 bg-[#ff7300] hover:bg-orange-600 text-white font-bold rounded shadow transition text-xs uppercase tracking-wider'
                  }, 'Đăng Nhập Quản Lý')
                ),

                e('div', { className: 'relative flex py-1 items-center' },
                  e('div', { className: 'flex-grow border-t border-slate-200' }),
                  e('span', { className: 'flex-shrink mx-3 text-slate-400 font-bold text-[10px] uppercase' }, 'Hoặc'),
                  e('div', { className: 'flex-grow border-t border-slate-200' })
                ),

                e('div', { className: 'text-center' },
                  e('button', {
                    type: 'button',
                    onClick: handleGuestSelect,
                    className: 'w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded shadow transition text-xs uppercase tracking-wider flex items-center justify-center gap-1.5'
                  }, '👁️ Truy cập Chế Độ Khách (Guest)'),
                  e('p', { className: 'text-[10px] text-slate-500 font-bold mt-2 italic' }, '* Chế độ Khách chỉ cho phép xem Dữ liệu Vi phạm & Biên bản quy trình.')
                )
              )
            );
          }

          return e('div', { className: 'min-h-screen flex flex-col bg-slate-50' },
            e('header', { className: 'bg-[#ff7300] text-white p-2 flex justify-between items-center shadow-md relative z-50' },
              e('div', { className: 'flex items-center gap-2.5' },
                e('div', { className: 'relative' },
                  e('button', {
                    className: 'p-1.5 rounded hover:bg-orange-600 transition flex flex-col justify-center items-center gap-1 w-7 h-7 bg-orange-700/60 border border-orange-400/40',
                    onClick: () => setIsMenuOpen(!isMenuOpen)

                            e('td', { className: 'p-2 text-slate-600 font-semibold' }, item.reporter)
                          )) : e('tr', null, e('td', { colSpan: 7, className: 'p-4 text-center text-slate-400 font-bold italic' }, 'Không tìm thấy dữ liệu vi phạm phù hợp.'))
                        )
                      ) :
                      e('table', { className: 'w-full text-left border-collapse text-[10.5px]' },
                        e('thead', { className: 'bg-slate-100 font-bold border-b border-slate-200 text-slate-700' },
                          e('tr', null,
                            e('th', { className: 'p-2 border-r border-slate-200 text-center w-10' }, 'STT'),
                            e('th', { className: 'p-2 border-r border-slate-200 w-28' }, 'Ngày Tạo'),
                            e('th', { className: 'p-2 border-r border-slate-200 w-28' }, 'Tài Khoản'),
                            e('th', { className: 'p-2 border-r border-slate-200 w-36 font-bold' }, 'Họ Và Tên'),
                            e('th', { className: 'p-2 border-r border-slate-200' }, 'Nội Dung Biên Bản'),
                            e('th', { className: 'p-2 border-r border-slate-200 w-24' }, 'ID Người Dùng'),
                            e('th', { className: 'p-2 border-r border-slate-200 w-28' }, 'Người Tạo'),
                            e('th', { className: 'p-2 text-center w-16' }, 'Hình Ảnh')
                          )
                        ),
                        e('tbody', null,
                          filteredRawData.length > 0 ? filteredRawData.map((item, idx) => e('tr', { key: item.id || idx, className: 'border-t border-slate-100 hover:bg-orange-50/30 transition' },
                            e('td', { className: 'p-2 border-r border-slate-100 text-center font-bold text-slate-400' }, idx + 1),
                            e('td', { className: 'p-2 border-r border-slate-100 font-bold text-slate-600' }, item.date),
                            e('td', { className: 'p-2 border-r border-slate-100 font-mono text-slate-600' }, item.username),
                            e('td', { className: 'p-2 border-r border-slate-100 font-bold text-slate-900' }, item.name),
                            e('td', { className: 'p-2 border-r border-slate-100 font-medium text-slate-800' }, item.content),
                            e('td', { className: 'p-2 border-r border-slate-100 font-mono text-slate-500 text-[9.5px]' }, item.userId),
                            e('td', { className: 'p-2 border-r border-slate-100 text-slate-600 font-semibold' }, item.creator),
                            e('td', { className: 'p-2 text-center font-bold' }, 
                              item.image ? e('a', { href: item.image, target: '_blank', rel: 'noreferrer', className: 'text-orange-600 hover:underline bg-orange-50 px-1.5 py-0.5 rounded border border-orange-200' }, '🖼️ Xem') : '-'
                            )
                          )) : e('tr', null, e('td', { colSpan: 8, className: 'p-4 text-center text-slate-400 font-bold italic' }, 'Không tìm thấy dữ liệu biên bản phù hợp.'))
                        )
                      )
                  )
                )
              )
            )
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
